version: '3.8'

services:
  app:
    image: php:8.2-fpm
    container_name: laravel_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "8000:8000"
    networks:
      - laravel
    depends_on:
      - mysql
    command: >
      sh -c "apt-get update &&
             apt-get install -y libzip-dev zip unzip curl git libpng-dev libonig-dev libxml2-dev &&
             docker-php-ext-install pdo_mysql mbstring zip exif pcntl bcmath gd &&
             php artisan migrate &&
             php artisan serve --host=0.0.0.0 --port=8000"
  mysql:
    image: mysql:8.0
    container_name: mysql_laravel
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: libreriatec
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: sail
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel
  node:
    image: node:18
    container_name: node_laravel
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "5173:5173"
    networks:
      - laravel
    command: sh -c "npm install && npm run dev"
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_laravel
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql
    networks:
      - laravel
networks:
  laravel:
volumes:
  db_data:
